<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicons/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
    <link rel="stylesheet" href="style.css">
    <script defer src="./js/script.js"></script>
    <title>Pokedex</title>
</head>
<body>

    <main>
        <img alt="pokemon" class="pokemon_image">
        <h1 class="pokemon_data">
            <span class="pokemon_number"></span> -
            <span class="pokemon_name"></span>
        </h1>

        <form class="form">
            <input
             type="search"
             class="input_search"
             placeholder="Name or Number"
             required
            />
        </form>

        <div class="buttons">
            <button type="button" class="button btn-prev">Prev &lt;</button>
            <button type="button" class="button btn-next">Next &gt;</button>
        </div>

        <img src="./images/pokedex.png" alt="Pokedex" class="pokedex">
    </main>

</body>
</html>
